name: Update GitHub Activity

on:
  schedule:
    - cron: "0 18 * * 1"
  workflow_dispatch:

permissions: # 设置权限
  contents: write # 允许写入仓库内容

jobs:
  github-achievements: # 任务名称
    runs-on: ubuntu-latest # 运行环境
    steps:
      - uses: actions/checkout@v3 # 检出仓库代码
      - uses: lowlighter/metrics@latest # 使用 metrics Action
        with:
          token: ${{ secrets.METRICS_TOKEN }} # 使用自定义 PAT
          filename: m.svg # 输出文件名
          base: header, activity, community
          plugin_achievements: no
          config_display: regular
          config_animations: no
          config_padding: 0, 12
          extras_css: |
            svg { color: #57606a; }
            .items-wrapper {
              box-sizing: border-box;
              padding: 16px;
              border: 1px solid #d1d9e0;
              border-radius: 12px;
              background: #ffffff;
            }
            h1 { color: #1f2328; margin-top: 0; margin-bottom: 8px; }
            h2 { color: #0969da; font-size: 15px; margin-top: 12px; margin-bottom: 6px; }
            .field { margin-bottom: 4px; line-height: 20px; }
            .field svg { fill: #57606a; }
            .row { gap: 8px; }
            @media (prefers-color-scheme: dark) {
              svg { color: #9da7b3; }
              .items-wrapper { background: #0d1117; border-color: #30363d; }
              h1 { color: #f0f6fc; }
              h2 { color: #58a6ff; }
              .field svg { fill: #9da7b3; }
            }
      - name: Commit & Push # 提交生成的文件
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add m.svg
          git diff --staged --quiet || git commit -m "Update GitHub activity"  # 只在有更改时提交
          git push || echo "No changes to push"  # 如果推送失败就显示消息
